api:
  allowed_extensions:
  - .png
  - .jpg
  - .jpeg
  - .bmp
  - .tif
  - .tiff
  max_upload_bytes: 2097152
  server_host: 127.0.0.1
  server_port: 8000
data:
  char_dataset_dir: data/uni_dataset
  line_images_dir: data/lines
  line_labels_file: data/lines.jsonl
data_sources:
  ahld29k:
    enabled: false
    image_dir: data/ahld29k
    manifest_file: data/manifests/ahld29k.jsonl
    repo_id: misiker/AHLD-29k
    streaming: true
    task_type: line
  fidel:
    enabled: false
    image_dir: data/fidel
    include_handwritten: true
    include_synthetic: false
    include_typed: false
    manifest_file: data/manifests/fidel.jsonl
    repo_id: upanzi/fidel-dataset
    task_type: line
  local_char:
    enabled: true
    image_dir: data/train_char
    manifest_file: data/manifests/train_char.jsonl
    root: C:/Users/nahom/Desktop/train_char/train_char
    task_type: char
    x_file: x_train.npy
    y_file: y_train.npy
inference:
  default_mode: char
  low_confidence_threshold: 0.6
models:
  cnn_checkpoint: models/amharic_ocr_v2.pth
  crnn_checkpoint: models/crnn_amharic_line.pth
pipeline:
  seed: 42
  split_dir: data/splits
  test_split: 0.1
  unified_manifest: data/manifests/unified.jsonl
  val_split: 0.2
preprocessing:
  img_height: 28
  img_width: 28
  max_skew_angle: 45
  mean: 0.239
  std: 0.407
project_root: .
training:
  batch_size: 64
  brightness: 0.15
  epochs: 20
  lr: 0.001
  rotation_degrees: 8
  scale: 0.95
  seed: 42
  shear_degrees: 4
  val_split: 0.2
