# Amharic Handwriting OCR configuration
# All paths are relative to the project root unless marked absolute.

project_root: .

data:
  # Root folder containing one sub-folder per Amharic character class
  # (e.g. data/uni_dataset/ሀ/001he.1.jpg). Copied from the source clone.
  char_dataset_dir: data/uni_dataset
  # Optional JSONL file for labeled text-line images: each line is
  #   <relative_image_path>\t<amharic unicode text>
  line_labels_file: data/lines.jsonl
  line_images_dir: data/lines

models:
  # Trained CNN checkpoint (isolated-character baseline). Copied from the
  # source clone's assets/amharic_ocr_v2.pth.
  cnn_checkpoint: models/amharic_ocr_v2.pth
  # Trained CRNN checkpoint (sequence/CTC line recognition). Not supplied;
  # train with scripts/train_crnn.py once line data is available.
  crnn_checkpoint: models/crnn_amharic_line.pth

preprocessing:
  # CNN input geometry (matches the supplied checkpoint).
  img_height: 28
  img_width: 28
  # Normalization statistics computed over the training split.
  mean: 0.239
  std: 0.407
  # Deskew: angles beyond this (degrees) are left untouched to avoid
  # over-rotating genuinely slanted handwriting.
  max_skew_angle: 45

training:
  batch_size: 64
  epochs: 20
  lr: 0.001
  # 80/20 train/validation split. Writer-separated when writer identity can
  # be derived from the image filename prefix; otherwise stratified random.
  val_split: 0.2
  seed: 42
  # Augmentation probabilities (handwriting-friendly, modest).
  rotation_degrees: 8
  scale: 0.95
  shear_degrees: 4
  brightness: 0.15

inference:
  # Default recognition mode: 'char' (whole image -> one character) or
  # 'line' (detect text lines, CRNN+CTC per line). Line mode is recommended
  # for documents; char mode for isolated characters.
  default_mode: char
  # Confidence threshold below which the API returns a low-confidence warning.
  low_confidence_threshold: 0.60

api:
  # Maximum upload size in bytes (~2 MB).
  max_upload_bytes: 2097152
  allowed_extensions: [".png", ".jpg", ".jpeg", ".bmp", ".tif", ".tiff"]
  server_host: 127.0.0.1
  server_port: 8000

# External dataset sources for the unified multi-dataset pipeline.
# Keep original datasets unchanged; processed images/manifests are written
# under data/ by scripts/download_datasets.py.
data_sources:
  # Local NumPy-based isolated-character dataset (32x32 grayscale, single
  # Ethiopic char per sample). Path is configurable; default points at the
  # user's local download.
  local_char:
    enabled: true
    root: C:/Users/nahom/Desktop/train_char
    x_file: x_train.npy
    y_file: y_train.npy
    task_type: char
    # Output location for extracted PNG images + manifest.
    image_dir: data/train_char
    manifest_file: data/manifests/train_char.jsonl

  # AHLD-29k: line-level handwritten Amharic (29,947 samples, parquet).
  ahld29k:
    enabled: true
    repo_id: misiker/AHLD-29k
    task_type: line
    image_dir: data/ahld29k
    manifest_file: data/manifests/ahld29k.jsonl
    # Stream to avoid loading the 4.6 GB parquet into memory.
    streaming: true

  # Fidel Dataset: line-level Amharic (130,727 samples, ZIP + JSON labels).
  fidel:
    enabled: true
    repo_id: upanzi/fidel-dataset
    task_type: line
    image_dir: data/fidel
    manifest_file: data/manifests/fidel.jsonl
    # Only keep handwritten samples for training; typed/synthetic can be
    # included for line recognition but flagged by source/type.
    include_handwritten: true
    include_typed: false
    include_synthetic: false

# Unified manifest + split output locations.
pipeline:
  unified_manifest: data/manifests/unified.jsonl
  split_dir: data/splits
  # Writer-separated split when writer_id available, else stratified random.
  val_split: 0.2
  test_split: 0.1
  seed: 42